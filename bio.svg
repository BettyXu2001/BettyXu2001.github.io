<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffecd2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffecd2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#bgGradient)" rx="256"/>
  
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <g filter="url(#shadow)">
    <path d="M160 130 L256 256 L352 130 L380 155 L288 275 L380 395 L352 420 L256 295 L160 420 L132 395 L224 275 L132 155 Z" 
          fill="url(#xGradient)" filter="url(#glow)"/>
  </g>
  
  <path d="M160 130 L256 256 L352 130" fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6"/>
  <path d="M160 420 L256 295 L352 420" fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6"/>
  
  <circle cx="120" cy="120" r="20" fill="rgba(255,255,255,0.3)"/>
  <circle cx="392" cy="130" r="12" fill="rgba(255,255,255,0.25)"/>
  <circle cx="100" cy="380" r="15" fill="rgba(255,255,255,0.2)"/>
  <circle cx="410" cy="390" r="18" fill="rgba(255,255,255,0.25)"/>
  <circle cx="256" cy="80" r="8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="256" cy="432" r="10" fill="rgba(255,255,255,0.2)"/>
  
  <ellipse cx="256" cy="256" rx="220" ry="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" transform="rotate(30 256 256)"/>
  <ellipse cx="256" cy="256" rx="220" ry="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" transform="rotate(-30 256 256)"/>
</svg>