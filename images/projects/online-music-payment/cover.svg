<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Online music willingness-to-pay research</title>
  <desc id="desc">An editorial illustration combining headphones, a questionnaire, data bars, and research metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf8ff"/>
      <stop offset="1" stop-color="#cfeeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24506a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="48" fill="url(#bg)"/>
  <circle cx="1350" cy="150" r="250" fill="#ffd86b" opacity=".9"/>
  <circle cx="1450" cy="850" r="310" fill="#86d4f3" opacity=".55"/>
  <path d="M0 790C290 660 500 860 820 740s560-80 780-210v470H0Z" fill="#fff" opacity=".72"/>

  <g transform="translate(110 120)" fill="#123d56" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif">
    <text y="0" font-size="28" font-weight="700" letter-spacing="5">MARKET RESEARCH · 2022</text>
    <text y="92" font-size="78" font-weight="800">Have You Subscribed?</text>
    <text y="158" font-size="36" font-weight="600" fill="#32657e">Online Music Willingness-to-Pay Study</text>
  </g>

  <g transform="translate(110 390)" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif">
    <g filter="url(#shadow)">
      <rect width="330" height="190" rx="28" fill="#fff"/>
      <text x="34" y="52" font-size="24" font-weight="700" fill="#32657e">VALID RESPONSES</text>
      <text x="34" y="132" font-size="72" font-weight="800" fill="#123d56">714</text>
      <path d="M232 130h60" stroke="#ffd04f" stroke-width="16" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 225)" filter="url(#shadow)">
      <rect width="330" height="190" rx="28" fill="#123d56"/>
      <text x="34" y="52" font-size="23" font-weight="700" fill="#bceaff">TOP DRIVERS</text>
      <text x="34" y="105" font-size="30" font-weight="800" fill="#fff">Catalog + Quality</text>
      <text x="34" y="155" font-size="38" font-weight="800" fill="#ffd86b">59.69%</text>
    </g>
  </g>

  <g transform="translate(570 300)" filter="url(#shadow)">
    <rect width="520" height="500" rx="42" fill="#fff"/>
    <rect x="70" y="58" width="380" height="56" rx="15" fill="#edf8fd"/>
    <circle cx="104" cy="86" r="12" fill="#ffd04f"/>
    <rect x="132" y="74" width="250" height="24" rx="12" fill="#90cfe8"/>
    <g fill="none" stroke="#88c9e3" stroke-width="12" stroke-linecap="round">
      <rect x="78" y="155" width="28" height="28" rx="6"/>
      <path d="M142 169h282"/>
      <rect x="78" y="223" width="28" height="28" rx="6"/>
      <path d="M142 237h230"/>
      <rect x="78" y="291" width="28" height="28" rx="6"/>
      <path d="M142 305h258"/>
    </g>
    <g transform="translate(78 382)">
      <rect width="58" height="58" rx="10" fill="#b9e6f7"/>
      <rect x="78" y="-28" width="58" height="86" rx="10" fill="#76c5e6"/>
      <rect x="156" y="-76" width="58" height="134" rx="10" fill="#ffd04f"/>
      <rect x="234" y="-112" width="58" height="170" rx="10" fill="#123d56"/>
    </g>
  </g>

  <g transform="translate(1160 360)" fill="none" stroke="#123d56" stroke-width="28" stroke-linecap="round">
    <path d="M40 190v-35a145 145 0 0 1 290 0v35"/>
    <rect x="0" y="170" width="70" height="165" rx="34" fill="#ffd86b" stroke="none"/>
    <rect x="300" y="170" width="70" height="165" rx="34" fill="#ffd86b" stroke="none"/>
    <path d="M335 320c0 80-58 120-132 120"/>
    <circle cx="190" cy="440" r="22" fill="#123d56" stroke="none"/>
    <path d="M190 105v130l-80 22" stroke="#f3b900"/>
    <circle cx="96" cy="267" r="34" fill="#f3b900" stroke="none"/>
  </g>

  <g transform="translate(1040 835)" font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect width="450" height="82" rx="41" fill="#fff" opacity=".94"/>
    <circle cx="49" cy="41" r="24" fill="#ffd04f"/>
    <path d="m38 42 8 9 17-21" fill="none" stroke="#123d56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
