    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18131f"/><stop offset="1" stop-color="#2b1626"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#ff5ca8"/><stop offset="1" stop-color="#ff9d66"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="180" fill="#ff5ca8" opacity=".09"/>
