  <text x="102" y="332" fill="#fff" font-size="64" font-weight="750">60</text><text x="102" y="369" fill="#cfc5d3" font-size="18">samples · 10 task types</text><rect x="102" y="396" width="154" height="8" rx="4" fill="url(#accent)"/>
