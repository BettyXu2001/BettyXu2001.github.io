<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Agent Eval Studio evaluation workflow</title>
  <desc id="desc">Golden Set flows through A/B evaluation and bad-case analysis into a release gate.</desc>
